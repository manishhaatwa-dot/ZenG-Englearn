<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#168a45">

  <meta
    name="description"
    content="ZenG English Learn - Learn English, practice grammar and chat with English learners."
  >

  <title>ZenG English Learn</title>

  <link rel="manifest" href="manifest.json">

  <style>
    /*
      Temporary base styling.
      Detailed UI styling will be moved to style.css
      in the next file.
    */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f4fbf6;
      color: #172019;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    #app {
      min-height: 100vh;
    }

    .app-loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: #f4fbf6;
    }

    .app-logo {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #168a45;
      color: #ffffff;
      font-size: 30px;
      box-shadow: 0 10px 30px rgba(22, 138, 69, 0.20);
    }

    .app-loading-title {
      font-size: 21px;
      font-weight: 800;
      color: #126b38;
    }

    .app-loading-text {
      font-size: 14px;
      color: #68746c;
    }

    body.dark-mode {
      background: #101512;
      color: #eef8f1;
    }

    body.dark-mode .app-loading {
      background: #101512;
    }

    body.dark-mode .app-loading-title {
      color: #6de39a;
    }

    body.dark-mode .app-loading-text {
      color: #a7b5ac;
    }
  </style>
</head>

<body>

  <div id="app">

    <!-- Initial loading screen -->
    <div class="app-loading" id="appLoading">

      <div class="app-logo" aria-hidden="true">
        🌿
      </div>

      <div class="app-loading-title">
        ZenG English Learn
      </div>

      <div class="app-loading-text">
        Loading your English learning space...
      </div>

    </div>

  </div>


  <!--
    Firebase + application JavaScript will be loaded
    after the required files are created.
  -->

  <script type="module" src="js/app.js"></script>

</body>
</html>
