<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#168a45"
  >

  <meta
    name="description"
    content="ZenG English Learn - Learn English, practice grammar and chat with English learners."
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="ZenG English"
  >

  <title>ZenG English Learn</title>


  <!-- =====================================================
       PWA MANIFEST
       ===================================================== -->

  <link
    rel="manifest"
    href="./manifest.json"
  >


  <!-- =====================================================
       MAIN CSS
       ===================================================== -->

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>


<body>

  <!-- =====================================================
       APPLICATION ROOT
       ===================================================== -->

  <div id="app">


    <!-- ===================================================
         SPLASH SCREEN
         =================================================== -->

    <div
      class="app-loading"
      id="appLoading"
      aria-label="ZenG English Learn loading"
    >

      <div class="splash-content">

        <div
          class="app-logo"
          aria-hidden="true"
        >
          🌿
        </div>


        <div class="app-loading-title">
          ZenG English Learn
        </div>


        <div class="app-loading-text">
          Powered by opnora.com
        </div>

      </div>

    </div>

  </div>


  <!-- =====================================================
       MAIN APPLICATION
       ===================================================== -->

  <script
    type="module"
    src="./js/app.js"
  ></script>


  <!-- =====================================================
       SERVICE WORKER REGISTRATION
       ===================================================== -->

  <script>

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        async () => {

          try {

            const registration =
              await navigator.serviceWorker.register(
                "./sw.js",
                {
                  scope: "./"
                }
              );


            console.log(
              "ZenG Service Worker registered:",
              registration.scope
            );


          } catch (error) {

            console.error(
              "ZenG Service Worker registration failed:",
              error
            );

          }

        }
      );

    }

  </script>

</body>

</html>
